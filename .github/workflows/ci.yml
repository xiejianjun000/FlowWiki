name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-check:
    name: Framework integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check framework structure
        run: |
          python -c "
          import sys
          from pathlib import Path
          base = Path('.')
          errors = []
          for f in ['CLAUDE.md', 'SCHEMA.md', 'AGENTS.md', 'README.md', 'config.toml', '.gitignore']:
              if not (base / f).exists(): errors.append(f'Missing: {f}')
          for f in ['.agents/CLAUDE.md', '.agents/AGENTS.md']:
              if not (base / f).exists(): errors.append(f'Missing: {f}')
          skills = list(base.glob('.skills/*/SKILL.md'))
          if not skills: errors.append('No skills in .skills/')
          if not (base / 'wiki/index.md').exists(): errors.append('Missing: wiki/index.md')
          for f in ['_scripts/quality_audit.py', '_scripts/lint.py']:
              if not (base / f).exists(): errors.append(f'Missing: {f}')
          configs = list(base.glob('storage/**/industry.yaml'))
          if not configs: errors.append('No industry configs')
          if errors:
              for e in errors: print(f'FAIL: {e}')
              sys.exit(1)
          print('All integrity checks passed.')
          "

  quality-gate:
    name: Framework quality audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run audit
        run: python _scripts/quality_audit.py --redline || echo "Audit complete (framework mode)"
